# .goreleaser.yaml
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - env:
      - CGO_ENABLED=0
    # Reproducible builds: no local paths in the binary and every embedded
    # timestamp comes from the commit, so anyone can rebuild a tag and compare.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.buildVersion={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    binary: git-user
    main: ./cmd/git-user

archives:
  - formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: 'checksums.txt'

# Keyless (Sigstore) signature over checksums.txt. The checksums cover every
# archive, so verifying this one signature authenticates them all. The bundle
# carries the certificate and transparency-log proof; it is produced with the
# workflow's OIDC identity, so there is no signing key to steal.
signs:
  - cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--yes'
      - '--bundle=${signature}'
      - '${artifact}'
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: divyo-argha
    name: git-user
  draft: false
  prerelease: auto
  mode: replace
