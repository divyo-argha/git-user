# Socket Security Configuration
# https://socket.dev/docs/config

version: 2

project:
  name: git-user

# Defer / ignore expected native code alerts for pre-compiled Go binaries bundled
# in platform-specific optional dependency subpackages (git-userhub-*).
# The npm packages are published with npm provenance (Sigstore, GitHub Actions
# OIDC); the GitHub release archives carry a cosign-signed checksums.txt and
# GitHub build attestations — see SECURITY.md for how to verify each.
issueRules:
  nativeCode: false
  installScripts: false
